<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - FinShield AI Enterprise</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #312e81 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      padding: 20px;
    }

    .auth-card {
      width: 100%;
      max-width: 460px;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #0f172a;
      text-align: center;
      backdrop-filter: blur(10px);
    }

    .brand-icon {
      font-size: 3.5rem;
      margin-bottom: 10px;
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }

    p.subtitle {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 24px;
    }

    .tab-switch {
      display: flex;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    .tab-btn {
      flex: 1;
      padding: 10px;
      border: none;
      background: transparent;
      font-weight: 700;
      font-size: 0.9rem;
      color: #64748b;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .tab-btn.active {
      background: #ffffff;
      color: #312e81;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .input-group {
      text-align: left;
      margin-bottom: 16px;
    }

    .input-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .input-group input, .input-group select {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      color: #0f172a;
      transition: border-color 0.2s ease;
      outline: none;
    }

    .input-group input:focus, .input-group select:focus {
      border-color: #6366f1;
    }

    .btn-submit {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #312e81 0%, #4338ca 100%);
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.1s ease, box-shadow 0.2s ease;
      margin-top: 10px;
    }

    .btn-submit:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 20px -5px rgba(49, 46, 129, 0.4);
    }

    .quick-access {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #e2e8f0;
    }

    .quick-access h4 {
      font-size: 0.8rem;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 12px;
    }

    .quick-btn {
      display: inline-block;
      width: 100%;
      padding: 10px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #334155;
      cursor: pointer;
      margin-bottom: 8px;
      transition: background 0.2s ease;
    }

    .quick-btn:hover {
      background: #e2e8f0;
    }

    .footer-note {
      margin-top: 20px;
      font-size: 0.8rem;
      color: rgba(255, 255, 255, 0.6);
    }
  </style>
</head>
<body>

  <div class="auth-card">
    <div class="brand-icon">🛡️</div>
    <h1>FinShield AI</h1>
    <p class="subtitle">Corporate Bankruptcy & Credit Solvency Engine</p>

    <div class="tab-switch">
      <button class="tab-btn active" id="tab-login" onclick="switchTab('login')">Sign In</button>
      <button class="tab-btn" id="tab-signup" onclick="switchTab('signup')">Register</button>
    </div>

    <!-- Login Form -->
    <div id="form-login">
      <div class="input-group">
        <label>Username / Email</label>
        <input type="text" id="login-user" placeholder="e.g. analyst or admin" value="analyst" />
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="login-pass" placeholder="••••••••" value="finshield123" />
      </div>
      <button class="btn-submit" onclick="handleLogin()">🚀 Sign In to Dashboard</button>
    </div>

    <!-- Signup Form -->
    <div id="form-signup" style="display: none;">
      <div class="input-group">
        <label>Username</label>
        <input type="text" id="signup-user" placeholder="Choose username" />
      </div>
      <div class="input-group">
        <label>Role</label>
        <select id="signup-role">
          <option>Financial Analyst</option>
          <option>Risk Director</option>
          <option>Credit Officer</option>
          <option>Portfolio Manager</option>
        </select>
      </div>
      <div class="input-group">
        <label>Password</label>
        <input type="password" id="signup-pass" placeholder="••••••••" />
      </div>
      <button class="btn-submit" onclick="handleSignup()">✨ Create Account</button>
    </div>

    <div class="quick-access">
      <h4>⚡ Quick Demo Credentials</h4>
      <button class="quick-btn" onclick="fillCreds('analyst', 'finshield123')">👨‍💼 Financial Analyst (analyst)</button>
      <button class="quick-btn" onclick="fillCreds('admin', 'admin123')">🛡️ Risk Director (admin)</button>
    </div>
  </div>

  <div class="footer-note">
    FinShield AI Enterprise Edition | Architected by Abhinay Patel & Sujal Gupta
  </div>

  <script>
    function switchTab(tab) {
      document.getElementById('tab-login').classList.toggle('active', tab === 'login');
      document.getElementById('tab-signup').classList.toggle('active', tab === 'signup');
      document.getElementById('form-login').style.display = tab === 'login' ? 'block' : 'none';
      document.getElementById('form-signup').style.display = tab === 'signup' ? 'block' : 'none';
    }

    function fillCreds(user, pass) {
      switchTab('login');
      document.getElementById('login-user').value = user;
      document.getElementById('login-pass').value = pass;
    }

    function handleLogin() {
      const user = document.getElementById('login-user').value;
      if (!user) {
        alert('Please enter your username.');
        return;
      }
      alert('🔐 Welcome to FinShield AI, ' + user + '! Connecting to Streamlit workspace...');
      window.location.href = 'index.html';
    }

    function handleSignup() {
      const user = document.getElementById('signup-user').value;
      if (!user) {
        alert('Please choose a username.');
        return;
      }
      alert('✨ Account for ' + user + ' registered successfully! Please sign in.');
      switchTab('login');
    }
  </script>
</body>
</html>
